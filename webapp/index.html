<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEFRdosh - So'z Boyligi</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #FAF5EB;
      color: #382D1D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .card-base {
      background: #FFFFFF;
      border: 1px solid #F0E6D2;
      box-shadow: 0 6px 20px rgba(180, 150, 100, 0.08);
      border-radius: 1.75rem;
    }
  </style>
</head>
<body class="pb-24 pt-3 px-4 min-h-screen flex flex-col justify-between">

  <!-- Yuqori Header Bar -->
  <header class="flex justify-between items-center mb-3">
    <button onclick="goBack()" class="flex items-center gap-1.5 bg-[#F3E5C8] text-[#382D1D] px-3.5 py-1.5 rounded-full font-bold text-xs shadow-sm active:scale-95 transition">
      <i class="fa-solid fa-xmark"></i> Yopish
    </button>
    <div class="flex items-center gap-2 font-bold text-xs">
      <div class="flex items-center gap-1 bg-[#F5EBD7] px-2.5 py-1.5 rounded-full text-[#D97706] shadow-sm">
        <i class="fa-solid fa-fire text-xs"></i>
        <span id="user-streak">1</span>
      </div>
      <div class="flex items-center gap-1 bg-[#F5EBD7] px-2.5 py-1.5 rounded-full text-[#B45309] shadow-sm">
        <i class="fa-solid fa-gem text-xs"></i>
        <span id="user-gems">270</span>
      </div>
    </div>
  </header>

  <!-- Progress Bar & Counter -->
  <div class="w-full max-w-md mx-auto mb-4 px-1">
    <div class="flex justify-between items-center mb-1.5 text-xs font-bold text-[#A39274]">
      <button onclick="prevCard()" class="w-7 h-7 bg-[#F5EBD7] rounded-full flex items-center justify-center text-[#5C4A33] active:scale-95">
        <i class="fa-solid fa-chevron-left text-[10px]"></i>
      </button>
      <div class="w-full mx-3 bg-[#EFE6D5] h-2.5 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-[#D9A036] to-[#B87D1B] h-full transition-all duration-300" style="width: 20%;"></div>
      </div>
      <span id="progress-text" class="font-mono text-[#7A6444]">1/5</span>
    </div>
  </div>

  <!-- Asosiy So'z Kartochkasi -->
  <main class="w-full max-w-md mx-auto my-auto">
    <div class="card-base p-6 text-center space-y-4 relative min-h-[320px] flex flex-col justify-between">
      
      <!-- Yuqori qism: So'z va Ovoz -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <span></span>
          <button onclick="playAudio()" class="w-10 h-10 rounded-full bg-[#FAF5EB] border border-[#F0E6D2] text-[#7A5B22] flex items-center justify-center shadow-sm active:scale-90 transition">
            <i class="fa-solid fa-volume-high text-sm"></i>
          </button>
        </div>
        <h1 id="card-word" class="text-3xl font-black text-[#382D1D] tracking-tight">agree</h1>
        <p id="card-pos" class="text-xs font-medium text-[#A39274] italic mt-0.5">verb</p>
      </div>

      <!-- Tarjima va Misol (Boshida yashirin yoki chiqib turadi) -->
      <div id="translation-container" class="space-y-2 py-2 border-t border-b border-[#F5EBD7] transition-all">
        <button id="show-trans-btn" onclick="revealTranslation()" class="px-5 py-2.5 bg-gradient-to-r from-[#D9A036] to-[#B87D1B] text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition mx-auto block">
          Show translation
        </button>
        <div id="translation-content" class="hidden space-y-2">
          <h2 id="card-translation" class="text-xl font-extrabold text-[#5C4A33]">rozi bo'lmoq</h2>
          <p id="card-example" class="text-xs text-[#7A6444] font-medium leading-relaxed italic">"I agree with you."<br><span class="not-italic text-[#A39274]">Men siz bilan roziman.</span></p>
        </div>
      </div>

      <!-- Pastki Baholash Tugmalari (Bilmadim, Qiyin, Oson) -->
      <div class="grid grid-cols-3 gap-2 pt-2">
        <button onclick="answerCard('bilmadim')" class="py-3 px-2 bg-[#E98989] hover:bg-[#E07575] text-white font-extrabold text-xs rounded-2xl shadow-sm active:scale-95 transition flex flex-col items-center justify-center gap-0.5">
          <span>Bilmadim</span>
        </button>
        <button onclick="answerCard('qiyin')" class="py-3 px-2 bg-[#E3B56B] hover:bg-[#D4A355] text-white font-extrabold text-xs rounded-2xl shadow-sm active:scale-95 transition flex flex-col items-center justify-center gap-0.5">
          <span>Qiyin</span>
        </button>
        <button onclick="answerCard('oson')" class="py-3 px-2 bg-[#7AC194] hover:bg-[#68B082] text-white font-extrabold text-xs rounded-2xl shadow-sm active:scale-95 transition flex flex-col items-center justify-center gap-0.5">
          <span>Oson</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Pastki Navigatsiya Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#FAF5EB]/95 backdrop-blur-md border-t border-[#EFE6D5] flex justify-around py-2.5 text-[10px] text-[#A39274] font-semibold z-20">
    <button onclick="goBack()" class="flex flex-col items-center gap-0.5 hover:text-[#382D1D]">
      <i class="fa-solid fa-chevron-left text-xs"></i>
      <span>Orqaga</span>
    </button>
    <button onclick="goHome()" class="flex flex-col items-center gap-0.5 hover:text-[#382D1D]">
      <i class="fa-solid fa-house text-sm"></i>
      <span>Bosh sahifa</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
