<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEFRdosh Web App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .card-flip {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="pb-24 pt-4 px-4 min-h-screen flex flex-col justify-between">

  <header class="bg-slate-800/80 backdrop-blur-md p-3.5 rounded-2xl border border-slate-700/60 shadow-lg flex justify-between items-center sticky top-2 z-20">
    <div class="flex items-center gap-3">
      <div id="user-avatar" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 text-slate-950 font-black flex items-center justify-center text-lg shadow-md shadow-amber-500/20">
        U
      </div>
      <div>
        <h2 id="user-name" class="font-bold text-sm text-slate-100 leading-tight">Foydalanuvchi</h2>
        <span id="user-level" class="text-[10px] font-extrabold uppercase px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-md">
          CEFR A1
        </span>
      </div>
    </div>
    <div class="flex items-center gap-3 font-bold text-xs">
      <div class="flex items-center gap-1.5 bg-slate-900/50 px-2.5 py-1.5 rounded-xl border border-slate-700/50 text-orange-400">
        <i class="fa-solid fa-fire text-orange-500"></i>
        <span id="user-streak">1 d</span>
      </div>
      <div class="flex items-center gap-1.5 bg-slate-900/50 px-2.5 py-1.5 rounded-xl border border-slate-700/50 text-amber-400">
        <i class="fa-solid fa-bolt text-amber-400"></i>
        <span id="user-xp">0 XP</span>
      </div>
    </div>
  </header>

  <main class="my-auto space-y-4 py-4">
    
    <div class="grid grid-cols-2 gap-3">
      
      <button onclick="openModule('vocabulary')" class="bg-slate-800/60 hover:bg-slate-800 active:scale-95 p-4 rounded-2xl border border-slate-700/60 text-left transition duration-200">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center text-lg mb-2.5">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <h3 class="font-bold text-sm text-slate-100">So'z boyligi</h3>
        <p class="text-[11px] text-slate-400 mt-0.5">Flashcard kartochkalar</p>
      </button>

      <button onclick="openModule('grammar')" class="bg-slate-800/60 hover:bg-slate-800 active:scale-95 p-4 rounded-2xl border border-slate-700/60 text-left transition duration-200">
        <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-lg mb-2.5">
          <i class="fa-solid fa-spell-check"></i>
        </div>
        <h3 class="font-bold text-sm text-slate-100">Grammatika</h3>
        <p class="text-[11px] text-slate-400 mt-0.5">Qoidalar & Testlar</p>
      </button>

      <button onclick="openModule('pronunciation')" class="bg-slate-800/60 hover:bg-slate-800 active:scale-95 p-4 rounded-2xl border border-slate-700/60 text-left transition duration-200">
        <div class="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 border border-purple-500/20 flex items-center justify-center text-lg mb-2.5">
          <i class="fa-solid fa-microphone"></i>
        </div>
        <h3 class="font-bold text-sm text-slate-100">AI Talaffuz</h3>
        <p class="text-[11px] text-slate-400 mt-0.5">Ovozli tekshiruv</p>
      </button>

      <button onclick="openModule('aichat')" class="bg-slate-800/60 hover:bg-slate-800 active:scale-95 p-4 rounded-2xl border border-slate-700/60 text-left transition duration-200">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center text-lg mb-2.5">
          <i class="fa-solid fa-robot"></i>
        </div>
        <h3 class="font-bold text-sm text-slate-100">AI Suhbatdosh</h3>
        <p class="text-[11px] text-slate-400 mt-0.5">Inglizcha muloqot</p>
      </button>

    </div>

    <section id="content-area" class="bg-slate-800/90 p-5 rounded-3xl border border-slate-700 shadow-xl hidden transition duration-300">
      <div class="flex justify-between items-center mb-4">
        <h3 id="module-title" class="font-black text-slate-100 text-base">Bo'lim</h3>
        <button onclick="closeModule()" class="w-7 h-7 rounded-full bg-slate-700/60 text-slate-400 hover:text-slate-200 flex items-center justify-center text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="module-body">
        </div>
    </section>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 flex justify-around py-2.5 text-slate-400 font-semibold text-[11px] z-20">
    <button class="flex flex-col items-center gap-1 text-amber-400">
      <i class="fa-solid fa-house text-lg"></i>
      <span>Bosh sahifa</span>
    </button>
    <button onclick="openModule('leaderboard')" class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
      <i class="fa-solid fa-trophy text-lg"></i>
      <span>Reyting</span>
    </button>
    <button class="flex flex-col items-center gap-1 hover:text-amber-400 transition">
      <i class="fa-solid fa-user text-lg"></i>
      <span>Profil</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
