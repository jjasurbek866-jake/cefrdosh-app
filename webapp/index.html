<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEFRdosh Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .card-flip {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-flip.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen justify-between">

    <!-- Header / Stats -->
    <div class="flex justify-between items-center bg-slate-800/60 p-3 rounded-2xl backdrop-blur-md border border-slate-700">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-fire text-orange-500 text-xl"></i>
            <span id="streak" class="font-bold text-lg">1 kun</span>
        </div>
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-bolt text-yellow-400 text-xl"></i>
            <span id="xp" class="font-bold text-lg">0 XP</span>
        </div>
        <div class="bg-indigo-600 px-3 py-1 rounded-xl text-xs font-bold uppercase tracking-wider">
            <span id="level">A1</span>
        </div>
    </div>

    <!-- Main Flashcard Section -->
    <div class="my-auto py-6">
        <div id="flashcard" class="card-flip w-full h-72 cursor-pointer" onclick="toggleCard()">
            <div class="card-inner relative w-full h-full duration-500">
                <!-- Front -->
                <div class="card-front absolute w-full h-full bg-slate-800 border-2 border-indigo-500/30 rounded-3xl p-6 flex flex-col justify-center items-center text-center shadow-xl">
                    <span class="text-xs font-semibold text-indigo-400 uppercase tracking-widest mb-2">Inglizcha</span>
                    <h2 id="word-en" class="text-3xl font-extrabold tracking-wide mb-4">Apple</h2>
                    <p id="example-en" class="text-slate-400 text-sm italic">"I eat a fresh apple every morning."</p>
                    <span class="text-xs text-slate-500 mt-6"><i class="fa-solid fa-rotate mr-1"></i> Bosing - Tarjimasi</span>
                </div>
                <!-- Back -->
                <div class="card-back absolute w-full h-full bg-indigo-900 border-2 border-indigo-400 rounded-3xl p-6 flex flex-col justify-center items-center text-center shadow-xl">
                    <span class="text-xs font-semibold text-indigo-200 uppercase tracking-widest mb-2">O'zbekcha</span>
                    <h2 id="word-uz" class="text-3xl font-extrabold text-white tracking-wide mb-4">Olma</h2>
                    <p id="example-uz" class="text-indigo-200 text-sm italic">"Men har kuni ertalab yangi olma yeyman."</p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex space-x-3 mt-6">
            <button onclick="nextWord(false)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-rose-500/30 py-3 rounded-2xl font-bold transition flex justify-center items-center space-x-2">
                <i class="fa-solid fa-xmark"></i>
                <span>Qiyin</span>
            </button>
            <button onclick="nextWord(true)" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-2xl font-bold shadow-lg shadow-indigo-600/30 transition flex justify-center items-center space-x-2">
                <i class="fa-solid fa-check"></i>
                <span>Bilaman (+10 XP)</span>
            </button>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="grid grid-cols-3 gap-2 bg-slate-800/80 p-2 rounded-2xl border border-slate-700 text-center text-slate-400">
        <button class="py-2 text-indigo-400 font-semibold flex flex-col items-center">
            <i class="fa-solid fa-layer-group text-lg"></i>
            <span class="text-xs mt-1">Lug'at</span>
        </button>
        <button class="py-2 hover:text-white font-semibold flex flex-col items-center">
            <i class="fa-solid fa-trophy text-lg"></i>
            <span class="text-xs mt-1">Reyting</span>
        </button>
        <button class="py-2 hover:text-white font-semibold flex flex-col items-center">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-xs mt-1">Profil</span>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
